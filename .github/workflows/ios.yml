name: build-ios-unsigned
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check project layout
        run: |
          ls -la
          test -f package.json
          test -f source.html
          xcodebuild -version
      - run: npm install
      - run: node assets.cjs
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Archive (unsigned)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild archive -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -r9 Yves-Cijing-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Yves-Cijing-ios-unsigned-ipa
          path: ios/App/build/Yves-Cijing-unsigned.ipa
