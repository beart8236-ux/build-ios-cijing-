name: build-mac
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check project layout
        run: |
          ls -la
          test -f package.json
          test -f source.html
      - run: npm install
      - run: node assets.cjs
      - run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Yves-Cijing-mac-arm64
          path: |
            release/*.dmg
            release/*.zip
